name: Release Python
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Branch, commit, or existing version tag (v0.1.0)
        required: true
        default: main
      publish:
        description: Publish verified wheels to PyPI (requires a matching version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python -c 'import os,tomllib; assert os.environ["PUBLISH"] != "true" or os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
      - name: Read compiler pins
        id: pins
        shell: bash
        run: |
          echo "native=$(cat NATIVE_REVISION)" >> "$GITHUB_OUTPUT"
          echo "core=$(cat CORE_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OrchidDB/OrchidDB-native
          ref: ${{ steps.pins.outputs.native }}
          path: compiler/orchiddb-native
      - uses: actions/checkout@v4
        with:
          repository: OrchidDB/OrchidDB
          ref: ${{ steps.pins.outputs.core }}
          path: compiler/orchiddb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler/orchiddb-native
      - name: Build pinned compiler
        env:
          ORCHIDDB_RELEASE_BUILD: '1'
        shell: bash
        run: cargo build --locked --release --manifest-path compiler/orchiddb-native/Cargo.toml
      - name: Bundle native compiler
        shell: bash
        run: |
          mkdir -p src/orchiddb/native
          case "$RUNNER_OS" in
            macOS) lib=liborchiddb_compiler.dylib ;;
            Linux) lib=liborchiddb_compiler.so ;;
            Windows) lib=orchiddb_compiler.dll ;;
          esac
          cp "compiler/orchiddb-native/target/release/$lib" src/orchiddb/native/
      - name: Package wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair dist/*.whl -w wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
