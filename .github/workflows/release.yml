name: Release Python
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.release_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-22.04
        - macos-14
        - macos-15-intel
        - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require shared compiler artifacts
      shell: bash
      env:
        NATIVE_RUNS: ${{ inputs.native_runs }}
        NATIVE_RUN_ID: ${{ inputs.native_run_id }}
      run: python -c 'import os; assert os.environ["NATIVE_RUNS"] != "{}" or os.environ["NATIVE_RUN_ID"], "Build the shared compiler once before
        packaging clients"'
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
    - name: Validate release version
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PUBLISH: ${{ inputs.publish }}
      run: |
        python -c 'import os,tomllib; assert os.environ["PUBLISH"] != "true" or os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
    - name: Download and verify the pinned platform compiler
      env:
        GH_TOKEN: ${{ github.token }}
        NATIVE_RUN_ID: ${{ runner.os == 'Windows' && inputs.windows_native_run_id || inputs.native_run_id }}
        NATIVE_RUNS: ${{ inputs.native_runs }}
      shell: bash
      run: |
        python - <<'PYTHON'
        import hashlib, json, os, platform, shutil, subprocess, sys, tarfile
        from pathlib import Path
        targets = {('Linux','x86_64'): ('x86_64-unknown-linux-gnu','liborchiddb_compiler.so'), ('Darwin','arm64'): ('aarch64-apple-darwin','liborchiddb_compiler.dylib'), ('Darwin','x86_64'): ('x86_64-apple-darwin','liborchiddb_compiler.dylib'), ('Windows','AMD64'): ('x86_64-pc-windows-msvc','orchiddb_compiler.dll')}
        target, library = targets[(platform.system(), platform.machine())]
        platform_name = {('Linux','x86_64'):'linux-x86_64', ('Darwin','arm64'):'macos-aarch64', ('Darwin','x86_64'):'macos-x86_64', ('Windows','AMD64'):'windows-x86_64'}[(platform.system(), platform.machine())]
        os.environ['NATIVE_RUN_ID'] = str(json.loads(os.environ['NATIVE_RUNS']).get(platform_name) or os.environ['NATIVE_RUN_ID'])
        assert os.environ['NATIVE_RUN_ID'].isdigit(), 'Missing shared compiler run for '+platform_name
        run = json.loads(subprocess.check_output(['gh','api','repos/OrchidDB/OrchidDB-native/actions/runs/'+os.environ['NATIVE_RUN_ID']], text=True))
        pin = Path('NATIVE_REVISION').read_text().strip()
        subprocess.run(['gh','run','download',os.environ['NATIVE_RUN_ID'],'--repo','OrchidDB/OrchidDB-native','--name','compiler-'+target,'--dir','.verified-native'],check=True)
        source = Path('.verified-native/SOURCE_COMMIT')
        assert (source.read_text().strip() if source.exists() else run['head_sha']) == pin, 'Compiler source does not match NATIVE_REVISION'
        archives = list(Path('.verified-native').glob('*.tar.gz'))
        assert len(archives) == 1
        with tarfile.open(archives[0]) as tar:
            metadata = json.load(tar.extractfile('manifest.json'))
            binary = tar.extractfile(metadata['library']).read()
        assert metadata['target'] == target
        assert hashlib.sha256(binary).hexdigest() == metadata['sha256']
        if Path('CORE_REVISION').exists():
            assert metadata['core_revision'] == Path('CORE_REVISION').read_text().strip()
        Path('.verified-native/lib').mkdir(exist_ok=True)
        Path('.verified-native/lib',library).write_bytes(binary)
        with open(os.environ['GITHUB_ENV'],'a') as env:
            env.write('VERIFIED_LIBRARY='+Path('.verified-native/lib',library).resolve().as_posix()+'\n')
            env.write('VERIFIED_CORE='+metadata['core_revision']+'\n')
        PYTHON
    - name: Bundle verified native compiler
      shell: bash
      run: |
        test -n "$VERIFIED_LIBRARY"
        mkdir -p src/orchiddb/native
        cp "$VERIFIED_LIBRARY" src/orchiddb/native/
    - name: Package wheel
      shell: bash
      run: |
        python -m pip install build
        python -m build --wheel
    - name: Repair Linux wheel
      if: runner.os == 'Linux'
      shell: bash
      run: |
        python -m pip install auditwheel patchelf
        auditwheel repair dist/*.whl -w wheelhouse
        rm dist/*.whl
        mv wheelhouse/*.whl dist/
    - name: Record source revision
      shell: bash
      run: git rev-parse HEAD > dist/SOURCE_COMMIT
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: dist/*
        overwrite: true
  publish:
    if: ${{ inputs.publish && inputs.release_id == '' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true
    - name: Remove build provenance from distributions
      run: rm -f dist/SOURCE_COMMIT
    - uses: pypa/gh-action-pypi-publish@release/v1
  publish-local:
    if: ${{ inputs.publish && inputs.release_id != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
    - name: Download the locally validated release packages
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        actual_tag=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .tag_name)
        test "$actual_tag" = "$RELEASE_TAG"
        mkdir dist
        gh release download "$RELEASE_TAG" --dir dist --pattern '*'
        cd dist
        sha256sum --check SHA256SUMS
        python - <<'PYTHON'
        from pathlib import Path
        for path in Path('.').iterdir():
            if path.is_file() and not path.name.endswith(('.whl', '.tar.gz')):
                path.unlink()
        PYTHON
    - name: Verify any already published files before resuming
      shell: bash
      run: |
        python - <<'PYTHON'
        import hashlib, json, os, urllib.request, urllib.error
        from pathlib import Path
        version = os.environ['RELEASE_TAG'].removeprefix('v')
        try:
            with urllib.request.urlopen('https://pypi.org/pypi/orchiddb/'+version+'/json') as response:
                existing = json.load(response)['urls']
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            existing = []
        for item in existing:
            path = Path('dist') / item['filename']
            assert path.is_file(), 'Published version has an unexpected file: '+item['filename']
            assert hashlib.sha256(path.read_bytes()).hexdigest() == item['digests']['sha256'], 'Published bytes differ: '+item['filename']
        PYTHON
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
run-name: orchiddb-python ${{ inputs.request_id }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Branch, commit, or existing version tag (v0.1.0)
        required: true
        default: main
      native_run_id:
        description: Verified native compiler workflow run (optional)
        required: false
        default: ''
      windows_native_run_id:
        description: Optional Windows artifact run when it differs from the other platforms
        required: false
        default: ''
      release_id:
        description: GitHub draft release ID containing locally built packages (skip all builds)
        required: false
        default: ''
      publish:
        description: Publish verified wheels to PyPI (requires a matching version tag)
        type: boolean
        default: false
      native_runs:
        description: Platform to shared-native build run ID JSON map
        type: string
        default: '{}'
      request_id:
        description: Coordinator request ID
        type: string
        default: ''
