name: Release Python
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Branch, commit, or existing version tag (v0.1.0)
        required: true
        default: main
      native_run_id:
        description: Verified native compiler workflow run (optional)
        required: false
        default: ''
      release_id:
        description: GitHub draft release ID containing locally built packages (skip all builds)
        required: false
        default: ''
      publish:
        description: Publish verified wheels to PyPI (requires a matching version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.release_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python -c 'import os,tomllib; assert os.environ["PUBLISH"] != "true" or os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("pyproject.toml","rb"))["project"]["version"]'
      - name: Download and verify the pinned platform compiler
        if: inputs.native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, platform, shutil, subprocess, sys, tarfile
          from pathlib import Path
          targets = {('Linux','x86_64'): ('x86_64-unknown-linux-gnu','liborchiddb_compiler.so'), ('Darwin','arm64'): ('aarch64-apple-darwin','liborchiddb_compiler.dylib'), ('Darwin','x86_64'): ('x86_64-apple-darwin','liborchiddb_compiler.dylib'), ('Windows','AMD64'): ('x86_64-pc-windows-msvc','orchiddb_compiler.dll')}
          target, library = targets[(platform.system(), platform.machine())]
          run = json.loads(subprocess.check_output(['gh','api','repos/OrchidDB/OrchidDB-native/actions/runs/'+os.environ['NATIVE_RUN_ID']], text=True))
          pin = Path('NATIVE_REVISION').read_text().strip()
          subprocess.run(['gh','run','download',os.environ['NATIVE_RUN_ID'],'--repo','OrchidDB/OrchidDB-native','--name','compiler-'+target,'--dir','.verified-native'],check=True)
          source = Path('.verified-native/SOURCE_COMMIT')
          assert (source.read_text().strip() if source.exists() else run['head_sha']) == pin, 'Compiler source does not match NATIVE_REVISION'
          archives = list(Path('.verified-native').glob('*.tar.gz'))
          assert len(archives) == 1
          with tarfile.open(archives[0]) as tar:
              metadata = json.load(tar.extractfile('manifest.json'))
              binary = tar.extractfile(metadata['library']).read()
          assert metadata['target'] == target
          assert hashlib.sha256(binary).hexdigest() == metadata['sha256']
          if Path('CORE_REVISION').exists():
              assert metadata['core_revision'] == Path('CORE_REVISION').read_text().strip()
          Path('.verified-native/lib').mkdir(exist_ok=True)
          Path('.verified-native/lib',library).write_bytes(binary)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('VERIFIED_LIBRARY='+Path('.verified-native/lib',library).resolve().as_posix()+'\n')
              env.write('VERIFIED_CORE='+metadata['core_revision']+'\n')
          PYTHON
      - name: Read compiler pins
        id: pins
        shell: bash
        run: |
          echo "native=$(cat NATIVE_REVISION)" >> "$GITHUB_OUTPUT"
          echo "core=$(cat CORE_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: inputs.native_run_id == ''
        with:
          repository: OrchidDB/OrchidDB-native
          ref: ${{ steps.pins.outputs.native }}
          path: compiler/orchiddb-native
      - uses: actions/checkout@v4
        if: inputs.native_run_id == ''
        with:
          repository: OrchidDB/OrchidDB
          ref: ${{ steps.pins.outputs.core }}
          path: compiler/orchiddb
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.native_run_id == ''
      - uses: Swatinem/rust-cache@v2
        if: inputs.native_run_id == ''
        with:
          workspaces: compiler/orchiddb-native
      - name: Build pinned compiler
        if: inputs.native_run_id == ''
        env:
          ORCHIDDB_RELEASE_BUILD: '1'
        shell: bash
        run: cargo build --locked --release --manifest-path compiler/orchiddb-native/Cargo.toml
      - name: Bundle native compiler
        shell: bash
        run: |
          mkdir -p src/orchiddb/native
          case "$RUNNER_OS" in
            macOS) lib=liborchiddb_compiler.dylib ;;
            Linux) lib=liborchiddb_compiler.so ;;
            Windows) lib=orchiddb_compiler.dll ;;
          esac
          if [ -n "${VERIFIED_LIBRARY:-}" ]; then
            cp "$VERIFIED_LIBRARY" src/orchiddb/native/
          else
            cp "compiler/orchiddb-native/target/release/$lib" src/orchiddb/native/
          fi
      - name: Package wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          auditwheel repair dist/*.whl -w wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
  publish:
    if: ${{ inputs.publish && inputs.release_id == '' }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-local:
    if: ${{ inputs.publish && inputs.release_id != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download the locally validated release packages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          actual_tag=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .tag_name)
          test "$actual_tag" = "$RELEASE_TAG"
          mkdir dist
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
